[package]
name = "daxo-eco-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
env_logger = "0.10"
tokio = { version = "1.0", features = ["full"] }
daxo-eco-core = { path = "../daxo-eco-core" }
hex = "0.4"
postcard = "1.0"